<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Clipboard Translate Overlay</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { max-width: 360px; padding: 24px; text-align: center; }
    .badge { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center;
      background: #da3633; color: #fff; font-size: 26px; font-weight: 700; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0 0 8px; opacity: .75; line-height: 1.45; font-size: 14px; }
    code { opacity: .6; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="badge">!</div>
    <h1>Не удалось загрузить Google Translate</h1>
    <p>Проверьте подключение к интернету. Скопируйте новый текст — приложение попробует загрузить перевод снова.</p>
    <code>Мониторинг буфера продолжает работать</code>
  </main>
</body>
</html>
